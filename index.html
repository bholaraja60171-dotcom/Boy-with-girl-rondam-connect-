
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Connect</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101020;color:white;font-family:Arial}
.app{max-width:450px;margin:auto}
h1{text-align:center;color:#d9aaff}
.card{background:#191932;padding:18px;border-radius:15px;margin:15px 0}
button,input{width:100%;padding:14px;margin:7px 0;border:0;border-radius:9px;font-size:16px}
button{background:#9849dc;color:white;font-weight:bold}
.secondary{background:#393952}
#messages{height:220px;overflow:auto;background:#101020;padding:10px;border-radius:8px}
.msg{background:#292943;padding:9px;margin:6px 0;border-radius:8px}
#status{text-align:center;color:#e3b5ff;min-height:25px}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<h1>💜 Random Connect</h1>
<p style="text-align:center">Meet New People • Make Friends • Chat Online</p>

<div class="card" id="loginCard">
<h2>Welcome</h2>
<button id="googleBtn">Continue with Google</button>
</div>

<div class="card hidden" id="homeCard">
<h2>आपका स्वागत है!</h2>
<button id="findBtn">🔎 Find Someone</button>
<button class="secondary" id="stopBtn">Stop Searching</button>
</div>

<div class="card hidden" id="chatCard">
<h2>💬 Live Chat</h2>
<div id="messages"></div>
<input id="messageInput" placeholder="अपना मैसेज लिखें">
<button id="sendBtn">Send Message</button>
</div>

<p id="status">ऐप शुरू हो रहा है...</p>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
 getAuth,GoogleAuthProvider,signInWithPopup,
 setPersistence,browserLocalPersistence,onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
 getDatabase,ref,onValue,push,runTransaction,remove,serverTimestamp
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyA2enQH1ezEOo-6vuNWdlU0R1Dsh6JTu0",
 authDomain:"rondam-connect.firebaseapp.com",
 databaseURL:"https://rondam-connect-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"rondam-connect",
 storageBucket:"rondam-connect.firebasestorage.app",
 messagingSenderId:"272514998066",
 appId:"1:272514998066:web:d8f3e9b41eb291fc84812b",
 measurementId:"G-H7P1XGCRBL"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const provider=new GoogleAuthProvider();

const $=id=>document.getElementById(id);
let user=null,roomId=null,messageListener=null,matchListener=null;

function status(t){$("status").textContent=t;}

function roomName(a,b){return [a,b].sort().join("_");}

await setPersistence(auth,browserLocalPersistence);

$("googleBtn").onclick=async()=>{
 try{
  status("Google से जुड़ रहे हैं...");
  await signInWithPopup(auth,provider);
 }catch(e){
  status("Google Login में समस्या: "+e.message);
 }
};

onAuthStateChanged(auth,u=>{
 user=u;
 if(u){
  $("loginCard").classList.add("hidden");
  $("homeCard").classList.remove("hidden");
  status("आप जुड़ गए हैं। Find Someone दबाएँ।");
 }else{
  $("loginCard").classList.remove("hidden");
  $("homeCard").classList.add("hidden");
  $("chatCard").classList.add("hidden");
  status("Continue with Google दबाएँ।");
 }
});

async function stopSearch(){
 if(!user)return;
 if(matchListener){matchListener();matchListener=null;}
 try{
  await remove(ref(db,"matchmaker/waiting/"+user.uid));
  status("खोज रोक दी गई।");
 }catch(e){status("रोकने में समस्या: "+e.message);}
}
$("stopBtn").onclick=stopSearch;

$("findBtn").onclick=async()=>{
 if(!user)return;
 $("findBtn").disabled=true;
 $("chatCard").classList.add("hidden");
 status("दूसरे ऑनलाइन यूजर को खोज रहे हैं...");

 try{
  const uid=user.uid;
  const result=await runTransaction(ref(db,"matchmaker"),data=>{
   data=data||{};
   data.waiting=data.waiting||{};
   data.matches=data.matches||{};

   if(data.matches[uid])return;

   const other=Object.keys(data.waiting).find(
    id=>id!==uid && data.waiting[id]?.status==="waiting"
   );

   if(other){
    const room=roomName(uid,other);
    delete data.waiting[other];
    data.matches[uid]={peerUid:other,roomId:room};
    data.matches[other]={peerUid:uid,roomId:room};
   }else{
    data.waiting[uid]={status:"waiting",createdAt:Date.now()};
   }
   return data;
  });

  const match=result.snapshot.child("matches/"+uid).val();
  if(match?.roomId){
   await openChat(match.roomId);
  }else{
   status("आप कतार में हैं। दूसरे यूजर का इंतज़ार है...");
   matchListener=onValue(
    ref(db,"matchmaker/matches/"+uid),
    async snap=>{
     const m=snap.val();
     if(m?.roomId){
      matchListener?.();
      matchListener=null;
      await openChat(m.roomId);
     }
    }
   );
  }
 }catch(e){
  status("कनेक्शन में समस्या: "+e.message);
  $("findBtn").disabled=false;
 }
};

async function openChat(id){
 roomId=id;
 $("chatCard").classList.remove("hidden");
 $("messages").innerHTML="";
 $("findBtn").disabled=false;
 status("कनेक्शन बन गया! अब चैट करें।");

 if(messageListener)messageListener();

 messageListener=onValue(
  ref(db,"rooms/"+id+"/messages"),
  snap=>{
   $("messages").innerHTML="";
   const data=snap.val()||{};
   Object.values(data).forEach(m=>{
    const div=document.createElement("div");
    div.className="msg";
    div.textContent=(m.uid===user.uid?"आप: ":"दूसरे यूजर: ")+m.text;
    $("messages").appendChild(div);
   });
   $("messages").scrollTop=$("messages").scrollHeight;
  }
 );
}

$("sendBtn").onclick=async()=>{
 const message=$("messageInput").value.trim();
 if(!message||!roomId||!user)return;
 try{
  await push(ref(db,"rooms/"+roomId+"/messages"),{
   uid:user.uid,
   text:message,
   createdAt:serverTimestamp()
  });
  $("messageInput").value="";
 }catch(e){
  status("मैसेज नहीं भेजा गया: "+e.message);
 }
};

$("messageInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("sendBtn").click();
});
</script>
</body>
</html>
